name: Android CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: check + assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted ubuntu runners ship the Android SDK with ANDROID_HOME set
      # and licences accepted, so no local.properties is needed here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint, ktlint, unit tests, assemble
        run: ./gradlew check assembleDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/**/build/reports/
          retention-days: 7
